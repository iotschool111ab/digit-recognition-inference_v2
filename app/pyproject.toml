[project]
name = "mnist-inference-app"
version = "0.1.0"
description = "MNIST multi-model inference API + web demo, deployed independently from training pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=4.30.0",
    "pillow>=9.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
