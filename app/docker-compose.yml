services:
  digit-recognition-inference:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ../models:/models:ro
    environment:
      - MODEL_DIR=/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s